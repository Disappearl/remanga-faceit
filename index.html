<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход через FACEIT</title><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e0f12;color:#f4f4ef;font:16px/1.4 "Segoe UI",Arial,sans-serif}
.c{max-width:420px;padding:28px;text-align:center}.c h1{font-size:22px;margin:0 0 10px;color:#f2a900}
.b{display:inline-block;margin:18px 0 10px;padding:14px 22px;border-radius:10px;background:#f2a900;color:#15110a;font-weight:700;text-decoration:none}
code{display:block;margin-top:14px;padding:10px;border-radius:8px;background:#1b1e24;word-break:break-all;user-select:all}
.d{color:#8b919b;font-size:14px}</style></head><body><div class="c"><h1>FACEIT подключён</h1>
<div id="t" class="d">Возвращаю в Telegram…</div><a id="go" class="b" href="#">Открыть бота</a>
<div class="d">Если бот не открылся — отправь ему эту команду:</div><code id="cmd"></code></div>
<script>
const p=new URLSearchParams(location.search),code=p.get("code")||"",state=p.get("state")||"";
const start="f"+state+"_"+code, ok=/^[A-Za-z0-9_-]{1,64}$/.test(start);
document.getElementById("cmd").textContent="/fcode "+state+" "+code;
const link="https://t.me/RePubg_bot?start="+encodeURIComponent(start);
const go=document.getElementById("go");
if(!code){document.getElementById("t").textContent="Кода входа нет — начни заново командой /faceit";go.style.display="none";}
else if(ok){go.href=link;location.href=link;}else{go.style.display="none";document.getElementById("t").textContent="Код длинный — отправь боту команду ниже.";}
</script></body></html>
